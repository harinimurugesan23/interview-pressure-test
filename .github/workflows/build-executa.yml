
name: Build Interview Pressure Test Executa

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
            archive: tar.gz
            executable: tool-dev-interview-pressure-test

          - os: macos-15-intel
            platform: darwin-x86_64
            archive: tar.gz
            executable: tool-dev-interview-pressure-test

          - os: ubuntu-latest
            platform: linux-x86_64
            archive: tar.gz
            executable: tool-dev-interview-pressure-test

          - os: windows-latest
            platform: windows-x86_64
            archive: zip
            executable: tool-dev-interview-pressure-test.exe

    defaults:
      run:
        working-directory: executas/interview-pressure-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate and read Executa metadata
        id: meta
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          expected_version = "0.1.3"

          with open("executa.json", encoding="utf-8") as f:
              metadata = json.load(f)

          actual_version = metadata.get("version")
          if actual_version != expected_version:
              raise SystemExit(
                  f"executa.json must be {expected_version}; "
                  f"found {actual_version!r}"
              )

          with open("pyproject.toml", encoding="utf-8") as f:
              project_text = f.read()

          import tomllib
          project = tomllib.loads(project_text)
          project_version = project["project"]["version"]

          if project_version != expected_version:
              raise SystemExit(
                  f"pyproject.toml must be {expected_version}; "
                  f"found {project_version!r}"
              )

          with open(
              "interview_pressure_test_plugin.py",
              encoding="utf-8"
          ) as f:
              plugin_text = f.read()

          if f'"version": "{expected_version}"' not in plugin_text:
              raise SystemExit(
                  f"Plugin MANIFEST must declare {expected_version}"
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as f:
              f.write(f"version={expected_version}\n")

          print(f"Validated Executa version: {expected_version}")

      - name: Install project dependencies
        run: uv sync --locked

      - name: Install PyInstaller
        run: uv pip install pyinstaller

      - name: Clean previous build outputs
        shell: bash
        run: |
          python -c "import shutil; from pathlib import Path; [shutil.rmtree(p, ignore_errors=True) if p.is_dir() else p.unlink(missing_ok=True) for p in (Path('build'), Path('dist'), Path('package'))]"

      - name: Build executable
        run: >
          uv run pyinstaller
          --onefile
          --clean
          --noconfirm
          --name "${{ matrix.executable }}"
          interview_pressure_test_plugin.py

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail

          mkdir -p package
          cp "dist/$EXECUTABLE" "package/$EXECUTABLE"
          chmod 755 "package/$EXECUTABLE"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          executable = os.environ["EXECUTABLE"]
          version = os.environ["VERSION"]

          manifest = {
              "name": "tool-dev-interview-pressure-test",
              "display_name": "Interview Pressure Test",
              "version": version,
              "description": (
                  "AI-powered adaptive interview question generator "
                  "for personalized mock interviews."
              ),
              "runtime": {
                  "binary": {
                      "entrypoint": {"default": executable},
                      "permissions": {executable: "0o755"}
                  }
              }
          }

          Path("package/manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          tar -czf \
            "dist/tool-dev-interview-pressure-test-${VERSION}-${PLATFORM}.tar.gz" \
            -C package "$EXECUTABLE" manifest.json

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item "dist/$env:EXECUTABLE" "package/$env:EXECUTABLE"

          $permissions = @{}
          $permissions[$env:EXECUTABLE] = "0o755"

          $manifest = @{
            name = "tool-dev-interview-pressure-test"
            display_name = "Interview Pressure Test"
            version = $env:VERSION
            description = "AI-powered adaptive interview question generator for personalized mock interviews."
            runtime = @{
              binary = @{
                entrypoint = @{
                  default = $env:EXECUTABLE
                }
                permissions = $permissions
              }
            }
          }

          $json = $manifest | ConvertTo-Json -Depth 10
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location).Path "package/manifest.json"),
            $json + "`n",
            $utf8NoBom
          )

          Compress-Archive `
            -Path "package/$env:EXECUTABLE", "package/manifest.json" `
            -DestinationPath "dist/tool-dev-interview-pressure-test-$env:VERSION-$env:PLATFORM.zip" `
            -Force

      - name: Verify archive contents and manifest
        shell: python
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          EXECUTABLE: ${{ matrix.executable }}
          PLATFORM: ${{ matrix.platform }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          import json
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          executable = os.environ["EXECUTABLE"]
          platform = os.environ["PLATFORM"]
          archive_format = os.environ["ARCHIVE_FORMAT"]

          suffix = ".tar.gz" if archive_format == "tar.gz" else ".zip"
          archive = Path(
              f"dist/tool-dev-interview-pressure-test-"
              f"{version}-{platform}{suffix}"
          )

          if not archive.is_file() or archive.stat().st_size == 0:
              raise SystemExit(f"Missing or empty archive: {archive}")

          if archive_format == "tar.gz":
              with tarfile.open(archive, "r:gz") as tf:
                  files = {
                      Path(member.name).name: member
                      for member in tf.getmembers()
                      if member.isfile()
                  }

                  if executable not in files or "manifest.json" not in files:
                      raise SystemExit(
                          "Archive must contain executable and manifest.json"
                      )

                  manifest_stream = tf.extractfile(files["manifest.json"])
                  if manifest_stream is None:
                      raise SystemExit("Cannot read manifest.json")

                  manifest = json.load(manifest_stream)

          else:
              with zipfile.ZipFile(archive) as zf:
                  files = {
                      Path(name).name: name
                      for name in zf.namelist()
                      if not name.endswith("/")
                  }

                  if executable not in files or "manifest.json" not in files:
                      raise SystemExit(
                          "Archive must contain executable and manifest.json"
                      )

                  manifest = json.loads(zf.read(files["manifest.json"]))

          if manifest.get("version") != version:
              raise SystemExit(
                  f"Manifest version mismatch: {manifest.get('version')!r}"
              )

          if manifest.get("name") != "tool-dev-interview-pressure-test":
              raise SystemExit("Unexpected manifest tool name")

          entrypoint = (
              manifest.get("runtime", {})
              .get("binary", {})
              .get("entrypoint", {})
              .get("default")
          )

          if entrypoint != executable:
              raise SystemExit(
                  f"Entrypoint mismatch: expected {executable!r}, "
                  f"found {entrypoint!r}"
              )

          print(f"PASS: {archive}")
          print(f"Size: {archive.stat().st_size} bytes")
          print(f"Version: {version}")
          print(f"Entrypoint: {entrypoint}")
          print("Executable and manifest are present.")

      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: interview-pressure-test-${{ matrix.platform }}
          path: executas/interview-pressure-test/dist/tool-dev-interview-pressure-test-${{ steps.meta.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error
          compression-level: 0
